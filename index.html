<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shape of Magic</title>
    <style>
        :root {
            --mana-color: #00e5ff; --sharp-color: #ff0055;
            --round-color: #a200ff; --line-color: #00ff88;
            --cast-color: #ffaa00; --bg-color: #05050a;
            --meteor-color: #ff4400; --beam-color: #00ffcc; --cloud-color: #7777ff;
            --heal-color: #00ff55; --terrain-color: #8b5a2b; --titan-color: #ffcc00;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
        #game-canvas { display: block; width: 100%; height: 100%; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; overflow: hidden; }
        #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,10,0.85) 100%); pointer-events: none; z-index: 5; }
        #time-filter { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 170, 0, 0.08); opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 1; mix-blend-mode: overlay; }
        #screen-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; transition: opacity 0.1s; mix-blend-mode: overlay; z-index: 20; }

        #zoom-container { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: auto; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
        #zoom-container span { color: white; font-size: 10px; font-weight: bold; margin: 5px 0; opacity: 0.8;}
        #zoom-slider { -webkit-appearance: slider-vertical; height: 150px; width: 10px; cursor: pointer; background: rgba(255,255,255,0.2); outline: none; border-radius: 5px; }
        #zoom-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--cast-color); cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.8); }

        #player-hp-container { position: absolute; top: 20px; left: 20px; width: 200px; height: 16px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.4); border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.8); overflow: hidden; }
        #player-hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ffaa00); transition: width 0.2s cubic-bezier(0.1, 0.8, 0.3, 1); }

        #crosshair { position: absolute; top: 45%; left: 50%; width: 32px; height: 32px; transform: translate(-50%, -50%); pointer-events: none; opacity: 0.7; transition: transform 0.1s, opacity 0.2s; }
        .ch-center { position: absolute; top: 14px; left: 14px; width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 5px #00e5ff; }
        .ch-ring { position: absolute; top: 0; left: 0; width: 28px; height: 28px; border: 2px solid rgba(0, 229, 255, 0.4); border-radius: 50%; border-style: dashed; animation: spin 4s linear infinite; }
        .ch-line { position: absolute; background: rgba(255,255,255,0.8); }
        .ch-t { top: 0; left: 15px; width: 2px; height: 8px; } .ch-b { bottom: 0; left: 15px; width: 2px; height: 8px; }
        .ch-l { top: 15px; left: 0; width: 8px; height: 2px; } .ch-r { top: 15px; right: 0; width: 8px; height: 2px; }

        #cam-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; z-index: -1; }

        .chat-bubble { position: absolute; background: rgba(255, 255, 255, 0.95); color: #111; font-weight: bold; font-size: 14px; padding: 8px 14px; border-radius: 12px; border: 2px solid rgba(0,0,0,0.1); transform: translate(-50%, -100%); pointer-events: none; opacity: 0; transition: opacity 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 15; text-align: center; max-width: 200px; word-wrap: break-word; }
        .chat-bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); border-width: 8px 8px 0; border-style: solid; border-color: rgba(255, 255, 255, 0.95) transparent transparent transparent; }

        #action-buttons { position: absolute; bottom: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; align-items: flex-end; }
        .btn-row { display: flex; gap: 8px; align-items: flex-end; }
        .magic-btn { border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; outline: none; transition: transform 0.05s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(4px); background: rgba(20, 20, 30, 0.7); width: 48px; height: 48px; }
        .magic-btn:active { transform: scale(0.85); }
        .btn-title { font-size: 9px; opacity: 0.9; margin-bottom: 2px;}
        .btn-val { font-size: 13px; text-shadow: 0 0 5px currentColor; font-weight: 900;}

        #btn-mana { border-bottom: 2px solid var(--mana-color); } #btn-mana .btn-val, #btn-mana .btn-title { color: var(--mana-color); }
        #btn-sharp { border-bottom: 2px solid var(--sharp-color); } #btn-sharp .btn-val, #btn-sharp .btn-title { color: var(--sharp-color); }
        #btn-round { border-bottom: 2px solid var(--round-color); } #btn-round .btn-val, #btn-round .btn-title { color: var(--round-color); }
        #btn-line { border-bottom: 2px solid var(--line-color); } #btn-line .btn-val, #btn-line .btn-title { color: var(--line-color); }
        #btn-clear { width: 38px; height: 38px; border-radius: 10px; background: rgba(50, 50, 60, 0.7); font-size: 9px; color: #aaa; border: 1px solid #444; }
        #btn-jump { width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); font-size: 9px; color: #fff; border: 1px solid #fff; margin-right: 10px; }
        #btn-cast { width: 65px; height: 65px; border-radius: 50%; background: radial-gradient(circle, #ffe259 0%, #ffa751 100%); font-size: 14px; font-weight: 900; color: #222; border: 2px solid rgba(255,255,255,0.6); box-shadow: 0 0 15px var(--cast-color); margin-top: 5px; transition: all 0.3s; }
        #pred-label { font-size: 8px; font-weight: bold; color: rgba(0,0,0,0.6); margin-top: 2px;}

        #joystick-zone { position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px; pointer-events: auto; }
        #stick-base { width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,255,255,0.05), rgba(0,0,0,0.3)); border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 50%; position: relative; backdrop-filter: blur(4px); box-sizing: border-box; }
        #stick-knob { width: 44px; height: 44px; background: rgba(255, 255, 255, 0.8); border-radius: 50%; position: absolute; top: 50%; left: 50%; margin-top: -22px; margin-left: -22px; box-shadow: inset 0 -3px 5px rgba(0,0,0,0.3), 0 5px 15px rgba(0,0,0,0.4); pointer-events: none; }

        #floating-texts { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .float-text { position: absolute; color: #fff; font-weight: 900; font-size: 20px; text-shadow: 0 2px 4px #000, 0 0 8px #ff0055; pointer-events: none; animation: floatUp 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; transform: translate(-50%, -50%); }
        
        #oracle-ui { position: absolute; top: 20px; right: 20px; pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; z-index: 50;}
        #oracle-chat { background: rgba(0, 10, 20, 0.85); color: #00e5ff; padding: 12px; border: 1px solid #00e5ff; border-radius: 8px; display: none; max-height: 250px; overflow-y: auto; width: 280px; font-size: 13px; text-shadow: 0 0 5px rgba(0,229,255,0.5); backdrop-filter: blur(5px); }
        #oracle-input { width: 258px; display: none; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid #00ff88; padding: 10px; border-radius: 8px; outline: none; }
        #oracle-btn { background: radial-gradient(circle, #00e5ff 0%, #0088aa 100%); color: #000; font-weight: bold; border: 2px solid rgba(255,255,255,0.5); padding: 10px 20px; border-radius: 20px; cursor: pointer; box-shadow: 0 0 10px #00e5ff; text-transform: uppercase; font-size: 12px; }

        @keyframes floatUp { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 20% { transform: translate(-50%, -60px) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -120px) scale(0.8); opacity: 0; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    
    <div id="ui-layer">
        <div id="vignette"></div>
        <div id="cam-zone"></div>
        <div id="time-filter"></div>
        <div id="screen-flash"></div>
        <div id="player-hp-container"><div id="player-hp-fill"></div></div>
        
        <div id="oracle-ui">
            <div id="oracle-chat"></div>
            <input type="text" id="oracle-input" placeholder="Ask the AI Oracle...">
            <button id="oracle-btn">ORACLE</button>
        </div>

        <div id="zoom-container">
            <span>ZOOM</span>
            <input type="range" id="zoom-slider" min="15" max="100" value="45" orient="vertical">
        </div>

        <div id="crosshair">
            <div class="ch-ring"></div><div class="ch-center"></div>
            <div class="ch-line ch-t"></div><div class="ch-line ch-b"></div>
            <div class="ch-line ch-l"></div><div class="ch-line ch-r"></div>
        </div>
        
        <div id="floating-texts"></div>
        <div id="chat-layer"></div>

        <div id="joystick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>

        <div id="action-buttons">
            <div class="btn-row"><button id="btn-clear" class="magic-btn">CLR</button></div>
            <div class="btn-row">
                <button id="btn-mana" class="magic-btn"><span class="btn-title">MANA</span><span class="btn-val" id="val-mana">[0]</span></button>
                <button id="btn-sharp" class="magic-btn"><span class="btn-title">SHARP</span><span class="btn-val" id="val-sharp">[0]</span></button>
                <button id="btn-round" class="magic-btn"><span class="btn-title">ROUND</span><span class="btn-val" id="val-round">[0]</span></button>
                <button id="btn-line" class="magic-btn"><span class="btn-title">LINE</span><span class="btn-val" id="val-line">[0]</span></button>
            </div>
            <div class="btn-row" style="justify-content: flex-end; width: 100%; align-items: center;">
                <button id="btn-jump" class="magic-btn">JUMP</button>
                <button id="btn-cast" class="magic-btn">CAST<span id="pred-label">NONE</span></button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        function dScale(value) { return Math.pow(value, 0.65); } 

        const State = { mana: 0, sharp: 0, round: 0, line: 0, spellType: 'NONE' };
        // Added activeAura tracking
        const PlayerStats = { hp: 100, maxHp: 100, baseSpeed: 28, speedMultiplier: 1.0, buffTimer: 0, lastMana: 0, isHighEnhance: false, healTimer: 0, healRate: 0, titanTimer: 0, titanMult: 1.0, frostTimer: 0, activeAura: null };
        // Fixed physics: decoupled velocities for momentum
        const Physics = { velX: 0, velZ: 0, velocityY: 0, gravity: 75, isGrounded: true, baseJumpForce: 30 };
        const COLORS = { mana: 0x00e5ff, sharp: 0xff0055, round: 0xa200ff, line: 0x00ff88, cast: 0xffaa00, env: 0x05050a, grid: 0x2a2a4a, meteor: 0xff4400, beam: 0x00ffcc, cloud: 0x6688ff, heal: 0x00ff55, terrain: 0x8b5a2b, titan: 0xffcc00 };
        
        let globalTimeScale = 1.0; let targetCamDist = 45;

        // --- CACHING SYSTEM (OPTIMIZATION) ---
        const GeoCache = {
            particleIco: new THREE.IcosahedronGeometry(0.3, 0),
            particleOct: new THREE.OctahedronGeometry(0.3, 0),
            particleBox: new THREE.BoxGeometry(0.4, 0.4, 0.4),
            particleTet: new THREE.TetrahedronGeometry(0.3, 0),
            auraLayer1: new THREE.CylinderGeometry(1, 1, 1, 3).translate(0, 0.5, 0).rotateX(Math.PI/2),
            auraLayer2: new THREE.CylinderGeometry(1, 1, 1, 4).translate(0, 0.5, 0).rotateX(Math.PI/2),
            coreBeam: new THREE.CylinderGeometry(1, 1, 1, 16).translate(0, 0.5, 0).rotateX(Math.PI/2),
            muzzleSphere: new THREE.SphereGeometry(1, 16, 16)
        };
        const particleGeos = [GeoCache.particleIco, GeoCache.particleOct, GeoCache.particleBox, GeoCache.particleTet];

        // --- GEMINI ORACLE ---
        async function askOracle(text) {
            const apiKey = "";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text }] }],
                systemInstruction: { parts: [{ text: "You are the cynical magic oracle of the arena. Keep answers under 2 sentences." }] }
            };
            let delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i <= delays.length; i++) {
                try {
                    let res = await fetch(url, { method: "POST", body: JSON.stringify(payload) });
                    if (!res.ok) throw new Error("API fail");
                    let data = await res.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "The Oracle shrugs.";
                } catch (e) {
                    if (i === delays.length) return "Oracle connection shattered.";
                    await new Promise(r => setTimeout(r, delays[i]));
                }
            }
        }

        document.getElementById('oracle-btn').addEventListener('pointerdown', async (e) => {
            e.stopPropagation(); e.preventDefault();
            const chat = document.getElementById('oracle-chat');
            const inp = document.getElementById('oracle-input');
            if (inp.style.display === 'none') {
                chat.style.display = 'block'; inp.style.display = 'block';
            } else {
                const val = inp.value.trim();
                if (val) {
                    chat.innerHTML += `<div style="color:#aaa; margin-top:5px;"><b>You:</b> ${val}</div>`;
                    inp.value = "Communing..."; inp.disabled = true;
                    const reply = await askOracle(val);
                    chat.innerHTML += `<div style="margin-top:2px;"><b>Oracle:</b> ${reply}</div>`;
                    inp.value = ""; inp.disabled = false;
                    chat.scrollTop = chat.scrollHeight;
                } else {
                    chat.style.display = 'none'; inp.style.display = 'none';
                }
            }
        });

        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        const scene = new THREE.Scene(); scene.background = new THREE.Color(COLORS.env); scene.fog = new THREE.FogExp2(COLORS.env, 0.0035); 
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);

        scene.add(new THREE.HemisphereLight(0x8888ff, 0x1a1a33, 0.9));
        const dirLight = new THREE.DirectionalLight(0x00e5ff, 1.6);
        dirLight.position.set(-30, 100, 40); scene.add(dirLight);

        const obstacles = []; const cameraColliders = []; const damageableColliders = []; const groundObjects = [];
        const cameraRaycaster = new THREE.Raycaster(); const beamRaycaster = new THREE.Raycaster(); const heightRaycaster = new THREE.Raycaster();

        // 1. BASE GRID
        const gridHelper = new THREE.GridHelper(900, 180, COLORS.grid, 0x151525);
        gridHelper.position.y = 0.01; gridHelper.material.transparent = true; gridHelper.material.opacity = 0.8;
        gridHelper.material.blending = THREE.AdditiveBlending; scene.add(gridHelper);

        const groundGeo = new THREE.PlaneGeometry(900, 900); const groundMat = new THREE.MeshPhongMaterial({ color: 0x0a0a12, depthWrite: true });
        const ground = new THREE.Mesh(groundGeo, groundMat); ground.rotation.x = -Math.PI / 2; scene.add(ground);
        cameraColliders.push(ground); groundObjects.push(ground);

        // 2. WESTERN EXPANSION
        const extWidth = 450; const extDepth = 900; 
        const extGeo = new THREE.PlaneGeometry(extWidth, extDepth, 40, 40);
        extGeo.rotateX(-Math.PI / 2);
        const posAttr = extGeo.attributes.position;
        for(let i=0; i<posAttr.count; i++) {
            let vx = posAttr.getX(i), vz = posAttr.getZ(i);
            let h = Math.sin(vx*0.02)*12 + Math.cos(vz*0.015)*8 + Math.sin((vx+vz)*0.05)*3;
            let lakeDist = Math.hypot(vx - 0, vz - 100);
            if(lakeDist < 120) { h -= (120 - lakeDist) * 0.25; }
            if(vx > 150) h *= (225-vx)/75;
            posAttr.setY(i, h);
        }
        extGeo.computeVertexNormals();
        const extMat = new THREE.MeshPhongMaterial({color: 0x162112, flatShading: true});
        const extMesh = new THREE.Mesh(extGeo, extMat);
        extMesh.position.set(-675, 0, 0); 
        scene.add(extMesh); cameraColliders.push(extMesh); groundObjects.push(extMesh);

        // 3. LAKE
        const waterGeo = new THREE.PlaneGeometry(180, 180); waterGeo.rotateX(-Math.PI/2);
        const waterMat = new THREE.MeshPhongMaterial({color: 0x0055aa, transparent: true, opacity: 0.7, shininess: 100});
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.set(-675, -5, 100); scene.add(water);

        // 4. TOPOLOGY
        function getMapHeight(x, z) {
            if (x >= -450) return 0;
            let lx = x + 675; let lz = z;
            let h = Math.sin(lx*0.02)*12 + Math.cos(lz*0.015)*8 + Math.sin((lx+lz)*0.05)*3;
            let lakeDist = Math.hypot(lx, lz - 100);
            if(lakeDist < 120) h -= (120 - lakeDist) * 0.25;
            if(lx > 150) h *= (225-lx)/75;
            return h;
        }

        // 5. CELESTIAL
        const skyGroup = new THREE.Group();
        skyGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(35, 2), new THREE.MeshBasicMaterial({ color: 0xaa00ff, wireframe: true })));
        skyGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(32, 3), new THREE.MeshBasicMaterial({ color: 0xff0088, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending })));
        const ring1 = new THREE.Mesh(new THREE.TorusGeometry(55, 1.0, 16, 64), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
        ring1.rotation.x = Math.PI / 2.5; skyGroup.add(ring1);
        skyGroup.position.set(-150, 200, -350); scene.add(skyGroup);

        const moon = new THREE.Group();
        moon.add(new THREE.Mesh(new THREE.SphereGeometry(35, 32, 32), new THREE.MeshBasicMaterial({color: 0xffff55, transparent: true, opacity: 1.0})));
        moon.add(new THREE.Mesh(new THREE.SphereGeometry(42, 32, 32), new THREE.MeshBasicMaterial({color: 0xffcc00, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending})));
        moon.position.set(300, 350, -200); scene.add(moon);

        // 6. ENVIRONMENT
        function spawnFlora(x, z, type) {
            const y = getMapHeight(x, z); if(y < -3) return;
            const grp = new THREE.Group();
            if(type === 'tree') {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.0, 20, 6).translate(0,10,0), new THREE.MeshPhongMaterial({color: 0x222222})); grp.add(trunk);
                const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(8, 1).translate(0, 22, 0), new THREE.MeshBasicMaterial({color: 0x33aa55, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending})); grp.add(leaves);
                obstacles.push({ x: x, z: z, r: 2.5 }); cameraColliders.push(trunk, leaves);
            } else if (type === 'flower') {
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 3).translate(0,1.5,0), new THREE.MeshPhongMaterial({color: 0x22aa22})); grp.add(stem);
                const petal = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 0).translate(0,3,0), new THREE.MeshBasicMaterial({color: 0xff33aa})); grp.add(petal);
            }
            grp.position.set(x, y, z); scene.add(grp);
        }

        for(let i=0; i<45; i++) {
            const isWest = Math.random() > 0.5;
            const px = isWest ? -450 - Math.random()*400 : (Math.random()-0.5)*800;
            const pz = (Math.random()-0.5)*800;
            spawnFlora(px, pz, Math.random() > 0.3 ? 'tree' : 'flower');
        }

        const envGeo = new THREE.CylinderGeometry(0, 4, 15, 6); const envMat = new THREE.MeshPhongMaterial({ color: 0x110a1a, flatShading: true });
        const pillarGeo = new THREE.BoxGeometry(6, 30, 6);
        for(let i=0; i<50; i++) {
            const isPillar = Math.random() > 0.5; const mesh = new THREE.Mesh(isPillar ? pillarGeo : envGeo, envMat);
            const isWest = Math.random() > 0.4;
            const px = isWest ? -450 + (Math.random()-0.5)*400 : (Math.random()-0.5)*800;
            const pz = (Math.random()-0.5)*800;
            const gy = getMapHeight(px, pz);
            if(gy < -3) continue;
            mesh.position.set(px, gy + (isPillar ? 15 : 7.5), pz);
            mesh.rotation.set((Math.random()-0.5)*0.3, Math.random()*Math.PI, (Math.random()-0.5)*0.3);
            scene.add(mesh); obstacles.push({ x: px, z: pz, r: isPillar ? 4.0 : 2.5 }); cameraColliders.push(mesh);
        }

        const bees = [];
        for(let i=0; i<20; i++) {
            const bee = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 1.2), new THREE.MeshBasicMaterial({color: 0xffdd00}));
            const px = -450 - Math.random()*300; const pz = (Math.random()-0.5)*600; const gy = getMapHeight(px, pz);
            bee.position.set(px, gy + 10, pz);
            bee.userData = { originY: gy + 10, speed: 2+Math.random()*2, offset: Math.random()*10, target: new THREE.Vector3() };
            scene.add(bee); bees.push(bee);
        }

        const wisps = [];
        for(let i=0; i<30; i++) {
            const wisp = new THREE.Mesh(new THREE.TetrahedronGeometry(0.5, 0), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending}));
            const px = (Math.random()-0.5)*800; const pz = (Math.random()-0.5)*800; const gy = getMapHeight(px, pz);
            wisp.position.set(px, gy + 5 + Math.random()*20, pz);
            wisp.userData = { originY: wisp.position.y, speed: 0.5+Math.random(), offset: Math.random()*10 };
            scene.add(wisp); wisps.push(wisp);
        }

        // --- PLAYER ---
        function createPlayerModel(isGhost = false) {
            const grp = new THREE.Group();

        // --- EXTRACTED UPDATE FUNCTIONS ---
        function updatePlayerMovement(dt, rawDt, time, targetGroundY) {
            // Re-written to decouple input from actual movement velocity (momentum retention)
            Physics.velocityY -= Physics.gravity * rawDt; 
            playerGroup.position.y += Physics.velocityY * rawDt;
            if (playerGroup.position.y <= targetGroundY) { playerGroup.position.y = targetGroundY; Physics.velocityY = 0; Physics.isGrounded = true; }

            const iceFactor = PlayerStats.frostTimer > 0 ? 0.4 : 1.0;
            const targetSpeed = PlayerStats.baseSpeed * PlayerStats.speedMultiplier * iceFactor;
            
            const worldDirX = moveVector.x * Math.cos(camYaw) + moveVector.y * Math.sin(camYaw); 
            const worldDirZ = -moveVector.x * Math.sin(camYaw) + moveVector.y * Math.cos(camYaw);
            
            const targetVX = worldDirX * targetSpeed;
            const targetVZ = worldDirZ * targetSpeed;

            // Physics momentum: Fast adaptation on ground, slow drift in air
            const accel = Physics.isGrounded ? 15 : 2;

        function updateGolems(dt, time) {

        function updateParticles(dt, rawDt) {
            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const p = activeParticles[i]; p.life -= dt;
                if (p.life <= 0) { scene.remove(p.mesh); activeParticles.splice(i, 1); } 
                else {
                    if (p.isFlash) { p.mesh.scale.setScalar(1 + (1 - p.life/p.maxLife)*0.5); p.mesh.material.opacity = p.life/p.maxLife; }
                    else if (p.isVolume) { const s = 1 + (1 - p.life/p.maxLife) * p.maxScale; p.mesh.scale.setScalar(s); p.mesh.material.opacity = (p.life/p.maxLife) * 0.7; }
                    else if (p.isWave) { const s = 1 + (1 - p.life/p.maxLife) * p.maxScale; p.mesh.scale.set(s, s, s); p.mesh.material.opacity = p.life/p.maxLife; } 
                    else if (p.isBolt) { p.mesh.material.opacity = p.life/p.maxLife; }
                    else { if(p.isSmoke) { p.vel.y += rawDt * 10; } else { p.vel.y -= rawDt * 15; } p.mesh.position.addScaledVector(p.vel, dt); p.mesh.material.opacity = p.life / p.maxLife; p.mesh.scale.setScalar(p.life / p.maxLife * 1.5); p.mesh.rotation.x += p.rotSpeed.x * dt * 20; p.mesh.rotation.y += p.rotSpeed.y * dt * 20; }
                }
            }
        }

            if(PlayerStats.titanTimer > 0) { PlayerStats.titanTimer -= rawDt; playerGroup.scale.lerp(new THREE.Vector3(PlayerStats.titanMult, PlayerStats.titanMult, PlayerStats.titanMult), 0.1); playerRadius = 1.5 * playerGroup.scale.x; } else { playerGroup.scale.lerp(new THREE.Vector3(1,1,1), 0.1); playerRadius = 1.5; }

            if(PlayerStats.healTimer > 0) { PlayerStats.healTimer -= rawDt; const healAmt = PlayerStats.healRate * rawDt; PlayerStats.hp = Math.min(PlayerStats.maxHp, PlayerStats.hp + healAmt); updateUI(); if(Math.random() < 0.1) spawnParticles(playerGroup.position, COLORS.heal, 1, 5, 0.5); if(PlayerStats.healTimer <= 0) showDamageText(PlayerStats.healRate * (5 + dScale(State.lastMana)*3), playerGroup.position, false, true); }

            if(activeChatBubble) { activeChatBubble.life -= rawDt; if(activeChatBubble.life <= 0) { activeChatBubble.el.style.opacity = '0'; setTimeout(()=> { if(activeChatBubble) activeChatBubble.el.remove(); activeChatBubble = null; }, 200); } else { activeChatBubble.el.style.opacity = '1'; const pos = playerGroup.position.clone(); pos.y += 6 * playerGroup.scale.y; pos.project(camera); const cx = (pos.x * 0.5 + 0.5) * window.innerWidth; const cy = (pos.y * -0.5 + 0.5) * window.innerHeight; activeChatBubble.el.style.transform = `translate(-50%, -100%) translate(${cx}px, ${cy}px)`; } }

            let targetGroundY = getMapHeight(playerGroup.position.x, playerGroup.position.z);
            updatePlayerMovement(dt, rawDt, time, targetGroundY);

            if (PlayerStats.buffTimer > 0) { PlayerStats.buffTimer -= rawDt; if (PlayerStats.buffTimer <= 0) { PlayerStats.speedMultiplier = 1.0; PlayerStats.isHighEnhance = false; globalTimeScale = 1.0; document.getElementById('time-filter').style.opacity = '0'; } }
            if (PlayerStats.frostTimer > 0) { PlayerStats.frostTimer -= rawDt; robe.material.color.setHex(0x88ccff); } else { robe.material.color.setHex(0x151525); }

            for(let i=obstacles.length-1; i>=0; i--) {
                const obs = obstacles[i];
                if(obs.isTerrainGroup) {
                    obs.life -= rawDt;
                    obs.chunks.forEach(c => { 
                        if(c.mesh.position.y < c.targetY) { c.mesh.position.y += rawDt * 15; c.mesh.position.x += (Math.random()-0.5)*0.2; c.mesh.position.z += (Math.random()-0.5)*0.2; }
                    });
                    if(obs.life <= 0) {
                        obs.chunks.forEach(c => { spawnParticles(c.mesh.position, COLORS.terrain, 5, 10, 0.5, 1.5, true); scene.remove(c.mesh); const ccIdx = cameraColliders.indexOf(c.mesh); if(ccIdx>-1) cameraColliders.splice(ccIdx, 1); });
                        obstacles.splice(i, 1);
                    }
                }
            }

            updateSpells(dt, time);
            
            for(let i = clouds.length - 1; i >= 0; i--) {
                const c = clouds[i]; c.life -= dt; if (c.life <= 0) { scene.remove(c.mesh); clouds.splice(i, 1); continue; }
                c.mesh.position.y = playerGroup.position.y + 10*playerGroup.scale.y + Math.sin(time * 2) * 2;
                if(!c.target || c.target.userData.hp <= 0) { let minDist = 150; c.target = null; dummies.forEach(d => { let dCenter = d.position.clone(); dCenter.y += d.userData.r * 1.5; const dist = c.mesh.position.distanceTo(dCenter); if(dist < minDist) { minDist = dist; c.target = d; } }); }
                if(c.target) {
                    const cloudTarg = c.target.position.clone(); cloudTarg.y += 15; c.mesh.position.lerp(cloudTarg, 0.03 * globalTimeScale);
                    c.attackTimer -= dt; if (c.attackTimer <= 0) { c.attackTimer = 5.0; c.target.userData.freezeTimer = c.freezeDur; applyDamage(c.target, 50); const dist = c.mesh.position.distanceTo(c.target.position); const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, dist, 4).translate(0, dist/2, 0), new THREE.MeshBasicMaterial({color: 0xffffff, blending: THREE.AdditiveBlending})); bolt.position.copy(c.target.position); bolt.lookAt(c.mesh.position); bolt.rotation.x -= Math.PI/2; scene.add(bolt); activeParticles.push({mesh: bolt, isBolt: true, life: 0.2, maxLife: 0.2}); spawnParticles(c.target.position, COLORS.cloud, 20, 10, 0.5, 2.0); }
                } c.mesh.children.forEach((puff, idx) => { puff.rotation.y += dt*(0.5+idx*0.1); });
            }

            for(let i = summons.length - 1; i >= 0; i--) {
                const sm = summons[i]; sm.life -= dt; if(sm.life <= 0) { spawnParticles(sm.mesh.position, COLORS.line, 10, 10, 0.5); scene.remove(sm.mesh); summons.splice(i, 1); continue; }
                if(!sm.target || sm.target.userData.hp <= 0) { let minDist = 999; sm.target = null; dummies.forEach(d => { const dist = sm.mesh.position.distanceTo(d.position); if(dist < minDist) { minDist = dist; sm.target = d; } }); }
                if(sm.target) { const dir = sm.target.position.clone().sub(sm.mesh.position); dir.y = 0; const dist = dir.length(); if(dist > sm.target.userData.r + 1.0) { dir.normalize(); sm.mesh.position.addScaledVector(dir, sm.speed * dt); sm.mesh.rotation.y = Math.atan2(dir.x, dir.z); sm.mesh.position.y = getMapHeight(sm.mesh.position.x, sm.mesh.position.z); } else { sm.attackTimer -= dt; if(sm.attackTimer <= 0) { sm.attackTimer = 0.5; applyDamage(sm.target, sm.damage); spawnParticles(sm.target.position, COLORS.line, 5, 5, 0.3); } } }
            }

            updateGolems(dt, time);
            for(let i = ghosts.length - 1; i >= 0; i--) { const g = ghosts[i]; g.life -= rawDt; if(g.life <= 0) { scene.remove(g.mesh); ghosts.splice(i, 1); } else { const op = (g.life / g.maxLife) * 0.4; g.mesh.traverse(c => { if(c.isMesh) c.material.opacity = op; }); } }
            updateParticles(dt, rawDt);

            camTargetPos.lerp(playerGroup.position, 0.15); const targetVec = new THREE.Vector3(camTargetPos.x, camTargetPos.y + 2.0*playerGroup.scale.y, camTargetPos.z);
            const dirY = Math.cos(camPitch); const hDist = Math.sin(camPitch); const dirX = Math.sin(camYaw) * hDist; const dirZ = Math.cos(camYaw) * hDist; const rayDir = new THREE.Vector3(dirX, dirY, dirZ).normalize();

            let actualCamDist = targetCamDist * playerGroup.scale.x; cameraRaycaster.set(targetVec, rayDir); const intersects = cameraRaycaster.intersectObjects(cameraColliders, false);
            if (intersects.length > 0 && intersects[0].distance < actualCamDist) { actualCamDist = Math.max(1.0, intersects[0].distance - 1.5); }
            let shakeX = 0, shakeY = 0, shakeZ = 0; if (shakeTime > 0) { shakeTime -= rawDt; shakeX = (Math.random() - 0.5) * shakeIntensity * 3; shakeY = (Math.random() - 0.5) * shakeIntensity * 3; shakeZ = (Math.random() - 0.5) * shakeIntensity * 3; }
            const targetCamPos = new THREE.Vector3(targetVec.x + rayDir.x * actualCamDist + shakeX, Math.max(0.5, targetVec.y + rayDir.y * actualCamDist + shakeY), targetVec.z + rayDir.z * actualCamDist + shakeZ);

            const lerpSpeed = actualCamDist < (targetCamDist-1)*playerGroup.scale.x ? 0.35 : 0.1; camera.position.lerp(targetCamPos, lerpSpeed); camera.lookAt(new THREE.Vector3(targetVec.x, targetVec.y + 1.0*playerGroup.scale.y, targetVec.z)); renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        updateUI(); animate();
    </script>
</body>
</html>
