<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shape of Magic</title>
    <style>
        :root {
            --mana-color: #00e5ff; --sharp-color: #ff0055;
            --round-color: #a200ff; --line-color: #00ff88;
            --cast-color: #ffaa00; --bg-color: #05050a;
            --meteor-color: #ff4400; --beam-color: #00ffcc; --cloud-color: #7777ff;
            --heal-color: #00ff55; --terrain-color: #885522; --titan-color: #ffcc00;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        #game-canvas { display: block; width: 100%; height: 100%; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; overflow: hidden; }

        #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,10,0.85) 100%); pointer-events: none; z-index: 5; }
        #time-filter { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 170, 0, 0.08); opacity: 0; pointer-events: none; transition: opacity 0.5s; z-index: 1; mix-blend-mode: overlay; }
        #screen-flash { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; transition: opacity 0.1s; mix-blend-mode: overlay; z-index: 20; }

        /* Player HP Bar */
        #player-hp-container {
            position: absolute; top: 20px; left: 20px; width: 200px; height: 16px;
            background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.4); border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.8); overflow: hidden;
        }
        #player-hp-fill {
            width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #ffaa00);
            transition: width 0.2s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        /* Enhanced Crosshair */
        #crosshair {
            position: absolute; top: 45%; left: 50%;
            width: 32px; height: 32px; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.7; transition: transform 0.1s, opacity 0.2s;
        }
        .ch-center { position: absolute; top: 14px; left: 14px; width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 5px #00e5ff; }
        .ch-ring { position: absolute; top: 0; left: 0; width: 28px; height: 28px; border: 2px solid rgba(0, 229, 255, 0.4); border-radius: 50%; border-style: dashed; animation: spin 4s linear infinite; }
        .ch-line { position: absolute; background: rgba(255,255,255,0.8); }
        .ch-t { top: 0; left: 15px; width: 2px; height: 8px; }
        .ch-b { bottom: 0; left: 15px; width: 2px; height: 8px; }
        .ch-l { top: 15px; left: 0; width: 8px; height: 2px; }
        .ch-r { top: 15px; right: 0; width: 8px; height: 2px; }

        #cam-zone { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; z-index: -1; }

        /* Roblox Style Chat Bubble */
        .chat-bubble {
            position: absolute; background: rgba(255, 255, 255, 0.95); color: #111; font-weight: bold; font-size: 14px;
            padding: 8px 14px; border-radius: 12px; border: 2px solid rgba(0,0,0,0.1);
            transform: translate(-50%, -100%); pointer-events: none; opacity: 0;
            transition: opacity 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 15;
            text-align: center; max-width: 200px; word-wrap: break-word;
        }
        .chat-bubble::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
            border-width: 8px 8px 0; border-style: solid; border-color: rgba(255, 255, 255, 0.95) transparent transparent transparent;
        }

        #action-buttons { position: absolute; bottom: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; align-items: flex-end; }
        .btn-row { display: flex; gap: 8px; align-items: flex-end; }
        .magic-btn { border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; outline: none; transition: transform 0.05s, box-shadow 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(4px); background: rgba(20, 20, 30, 0.7); width: 48px; height: 48px; }
        .magic-btn:active { transform: scale(0.85); }
        .btn-title { font-size: 9px; opacity: 0.9; margin-bottom: 2px;}
        .btn-val { font-size: 13px; text-shadow: 0 0 5px currentColor; font-weight: 900;}

        #btn-mana { border-bottom: 2px solid var(--mana-color); } #btn-mana .btn-val, #btn-mana .btn-title { color: var(--mana-color); }
        #btn-sharp { border-bottom: 2px solid var(--sharp-color); } #btn-sharp .btn-val, #btn-sharp .btn-title { color: var(--sharp-color); }
        #btn-round { border-bottom: 2px solid var(--round-color); } #btn-round .btn-val, #btn-round .btn-title { color: var(--round-color); }
        #btn-line { border-bottom: 2px solid var(--line-color); } #btn-line .btn-val, #btn-line .btn-title { color: var(--line-color); }

        #btn-clear { width: 38px; height: 38px; border-radius: 10px; background: rgba(50, 50, 60, 0.7); font-size: 9px; color: #aaa; border: 1px solid #444; }
        #btn-jump { width: 42px; height: 42px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); font-size: 9px; color: #fff; border: 1px solid #fff; margin-right: 10px; }
        #btn-cast { width: 65px; height: 65px; border-radius: 50%; background: radial-gradient(circle, #ffe259 0%, #ffa751 100%); font-size: 14px; font-weight: 900; color: #222; border: 2px solid rgba(255,255,255,0.6); box-shadow: 0 0 15px var(--cast-color); margin-top: 5px; transition: all 0.3s; }
        #pred-label { font-size: 8px; font-weight: bold; color: rgba(0,0,0,0.6); margin-top: 2px;}

        #joystick-zone { position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px; pointer-events: auto; }
        #stick-base { width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,255,255,0.05), rgba(0,0,0,0.3)); border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 50%; position: relative; backdrop-filter: blur(4px); box-sizing: border-box; }
        #stick-knob { width: 44px; height: 44px; background: rgba(255, 255, 255, 0.8); border-radius: 50%; position: absolute; top: 50%; left: 50%; margin-top: -22px; margin-left: -22px; box-shadow: inset 0 -3px 5px rgba(0,0,0,0.3), 0 5px 15px rgba(0,0,0,0.4); pointer-events: none; }

        #floating-texts { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .float-text { position: absolute; color: #fff; font-weight: 900; font-size: 20px; text-shadow: 0 2px 4px #000, 0 0 8px #ff0055; pointer-events: none; animation: floatUp 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; transform: translate(-50%, -50%); }
        @keyframes floatUp { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 20% { transform: translate(-50%, -60px) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -120px) scale(0.8); opacity: 0; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    
    <div id="ui-layer">
        <div id="vignette"></div>
        <div id="cam-zone"></div>
        <div id="time-filter"></div>
        <div id="screen-flash"></div>
        <div id="player-hp-container"><div id="player-hp-fill"></div></div>
        
        <div id="crosshair">
            <div class="ch-ring"></div>
            <div class="ch-center"></div>
            <div class="ch-line ch-t"></div><div class="ch-line ch-b"></div>
            <div class="ch-line ch-l"></div><div class="ch-line ch-r"></div>
        </div>
        
        <div id="floating-texts"></div>
        <div id="chat-layer"></div>

        <div id="joystick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>

        <div id="action-buttons">
            <div class="btn-row"><button id="btn-clear" class="magic-btn">CLR</button></div>
            <div class="btn-row">
                <button id="btn-mana" class="magic-btn"><span class="btn-title">MANA</span><span class="btn-val" id="val-mana">[0]</span></button>
                <button id="btn-sharp" class="magic-btn"><span class="btn-title">SHARP</span><span class="btn-val" id="val-sharp">[0]</span></button>
                <button id="btn-round" class="magic-btn"><span class="btn-title">ROUND</span><span class="btn-val" id="val-round">[0]</span></button>
                <button id="btn-line" class="magic-btn"><span class="btn-title">LINE</span><span class="btn-val" id="val-line">[0]</span></button>
            </div>
            <div class="btn-row" style="justify-content: flex-end; width: 100%; align-items: center;">
                <button id="btn-jump" class="magic-btn">JUMP</button>
                <button id="btn-cast" class="magic-btn">CAST<span id="pred-label">NONE</span></button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- DIMINISHING SCALING MATH ---
        function dScale(value) { return Math.pow(value, 0.65); } // Curves growth instead of linear bloat

        // --- STATE & PHYSICS ---
        const State = { mana: 0, sharp: 0, round: 0, line: 0, spellType: 'NONE' };
        const PlayerStats = { hp: 100, maxHp: 100, baseSpeed: 28, speedMultiplier: 1.0, buffTimer: 0, lastMana: 0, isHighEnhance: false, healTimer: 0, healRate: 0, titanTimer: 0, titanMult: 1.0 };
        const Physics = { velocityY: 0, gravity: 75, isGrounded: true, baseJumpForce: 30 };
        const COLORS = { mana: 0x00e5ff, sharp: 0xff0055, round: 0xa200ff, line: 0x00ff88, cast: 0xffaa00, env: 0x05050a, grid: 0x2a2a4a, meteor: 0xff4400, beam: 0x00ffcc, cloud: 0x6688ff, heal: 0x00ff55, titan: 0xffcc00 };
        
        let globalTimeScale = 1.0; 

        // --- CORE SETUP ---
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(COLORS.env);
        scene.fog = new THREE.FogExp2(COLORS.env, 0.004); 

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

        scene.add(new THREE.HemisphereLight(0x8888ff, 0x1a1a33, 0.9));
        const dirLight = new THREE.DirectionalLight(0x00e5ff, 1.1);
        dirLight.position.set(-30, 100, 40);
        scene.add(dirLight);

        const obstacles = []; 
        const cameraColliders = []; 
        const damageableColliders = []; 
        const cameraRaycaster = new THREE.Raycaster();
        const beamRaycaster = new THREE.Raycaster();

        // 25% larger map base
        const gridHelper = new THREE.GridHelper(900, 180, COLORS.grid, 0x151525);
        gridHelper.position.y = 0.01; gridHelper.material.transparent = true; gridHelper.material.opacity = 0.8;
        gridHelper.material.blending = THREE.AdditiveBlending; scene.add(gridHelper);

        const groundGeo = new THREE.PlaneGeometry(900, 900);
        const groundMat = new THREE.MeshPhongMaterial({ color: 0x0a0a12, depthWrite: true });
        const ground = new THREE.Mesh(groundGeo, groundMat); ground.rotation.x = -Math.PI / 2; scene.add(ground);
        cameraColliders.push(ground);

        // --- ENVIRONMENT: CELESTIAL, MOON & TREES ---
        const skyGroup = new THREE.Group();
        skyGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(35, 2), new THREE.MeshBasicMaterial({ color: 0xaa00ff, wireframe: true })));
        skyGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(32, 3), new THREE.MeshBasicMaterial({ color: 0xff0088, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending })));
        const ring1 = new THREE.Mesh(new THREE.TorusGeometry(55, 1.0, 16, 64), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
        ring1.rotation.x = Math.PI / 2.5; skyGroup.add(ring1);
        skyGroup.position.set(-150, 200, -350); scene.add(skyGroup);

        const moon = new THREE.Group();
        moon.add(new THREE.Mesh(new THREE.SphereGeometry(35, 32, 32), new THREE.MeshBasicMaterial({color: 0xffea00, transparent: true, opacity: 0.9})));
        moon.add(new THREE.Mesh(new THREE.SphereGeometry(40, 32, 32), new THREE.MeshBasicMaterial({color: 0xffaa00, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending})));
        moon.position.set(300, 350, -200); scene.add(moon);

        function spawnTree(x, z) {
            const treeGrp = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.0, 20, 6).translate(0,10,0), new THREE.MeshPhongMaterial({color: 0x222222}));
            treeGrp.add(trunk);
            const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(8, 1).translate(0, 22, 0), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending}));
            treeGrp.add(leaves);
            treeGrp.position.set(x, 0, z); scene.add(treeGrp);
            obstacles.push({ x: x, z: z, r: 2.5 }); cameraColliders.push(trunk, leaves);
        }
        for(let i=0; i<15; i++) {
            const angle = Math.random()*Math.PI*2; const rad = 60 + Math.random()*350;
            spawnTree(Math.cos(angle)*rad, Math.sin(angle)*rad);
        }

        const wisps = [];
        for(let i=0; i<30; i++) {
            const wisp = new THREE.Mesh(new THREE.TetrahedronGeometry(0.5, 0), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending}));
            wisp.position.set((Math.random()-0.5)*400, 5+Math.random()*20, (Math.random()-0.5)*400);
            wisp.userData = { originY: wisp.position.y, speed: 0.5+Math.random(), offset: Math.random()*10 };
            scene.add(wisp); wisps.push(wisp);
        }

        const envGeo = new THREE.CylinderGeometry(0, 4, 15, 6); const envMat = new THREE.MeshPhongMaterial({ color: 0x110a1a, flatShading: true });
        const pillarGeo = new THREE.BoxGeometry(6, 30, 6);
        for(let i=0; i<40; i++) {
            const isPillar = Math.random() > 0.5; const mesh = new THREE.Mesh(isPillar ? pillarGeo : envGeo, envMat);
            const r = 50 + Math.random() * 350; const a = Math.random() * Math.PI * 2;
            const px = Math.cos(a)*r; const pz = Math.sin(a)*r;
            mesh.position.set(px, isPillar ? 15 : 7.5, pz); mesh.rotation.y = Math.random() * Math.PI;
            if(!isPillar) { mesh.rotation.x = (Math.random()-0.5)*0.3; mesh.rotation.z = (Math.random()-0.5)*0.3; }
            scene.add(mesh); obstacles.push({ x: px, z: pz, r: isPillar ? 4.0 : 2.5 }); cameraColliders.push(mesh);
        }

        // --- PLAYER CREATION ---
        function createPlayerModel(isGhost = false) {
            const grp = new THREE.Group();
            const matParams = isGhost ? { color: COLORS.cast, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false } : { color: 0x151525, flatShading: true };
            const robeMat = isGhost ? new THREE.MeshBasicMaterial(matParams) : new THREE.MeshPhongMaterial(matParams);
            
            const robe = new THREE.Mesh(new THREE.ConeGeometry(1.4, 4.2, 7).translate(0, 2.1, 0), robeMat); grp.add(robe);
            
            const headGrp = new THREE.Group(); headGrp.position.set(0, 4.2, 0);
            headGrp.add(new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), isGhost ? robeMat : new THREE.MeshPhongMaterial({ color: 0x08080c })));
            
            const brimMat = isGhost ? robeMat : new THREE.MeshPhongMaterial({ color: 0x221544, flatShading: true });
            const brim = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.1, 12), brimMat); brim.position.y = 0.2; brim.rotation.x = -0.1; headGrp.add(brim);
            const hatCone = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.8, 8).translate(0, 1.4, 0), brimMat); hatCone.position.y = 0.2; hatCone.rotation.x = -0.2; headGrp.add(hatCone);
            grp.add(headGrp);

            const staffGrp = new THREE.Group(); staffGrp.position.set(1.5, 0, 1.2);
            staffGrp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.05, 5.5, 5).translate(0, 2.75, 0), isGhost ? robeMat : new THREE.MeshPhongMaterial({ color: 0x3d2215 })));
            const staffOrb = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 12), isGhost ? robeMat : new THREE.MeshBasicMaterial({ color: COLORS.cast })); staffOrb.position.set(0, 5.7, 0);
            if(!isGhost) staffOrb.add(new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 12), new THREE.MeshBasicMaterial({ color: COLORS.cast, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending })));
            staffGrp.add(staffOrb); grp.add(staffGrp);
            return { grp, robe, staffOrb };
        }

        const playerAssets = createPlayerModel(false);
        const playerGroup = playerAssets.grp; const robe = playerAssets.robe; const staffOrb = playerAssets.staffOrb;
        scene.add(playerGroup); let playerRadius = 1.5;

        // --- VFX SYSTEMS ---
        const spells = []; const summons = []; const clouds = []; const dummies = []; const activeParticles = []; const ghosts = [];
        const particleGeos = [new THREE.IcosahedronGeometry(0.3, 0), new THREE.OctahedronGeometry(0.3, 0), new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.TetrahedronGeometry(0.3, 0)];

        function spawnParticles(pos, colorHex, count, speed, lifeBase, scaleMult=1, isSmoke=false) {
            if(activeParticles.length > 500) return; 
            const mat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, blending: isSmoke ? THREE.NormalBlending : THREE.AdditiveBlending });
            for(let i=0; i<count; i++) {
                const geo = particleGeos[Math.floor(Math.random() * particleGeos.length)]; const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos); mesh.position.add(new THREE.Vector3((Math.random()-0.5)*3, (Math.random()-0.5)*3, (Math.random()-0.5)*3)); mesh.scale.setScalar(scaleMult * (0.5 + Math.random()*0.5)); scene.add(mesh);
                activeParticles.push({ mesh: mesh, vel: new THREE.Vector3((Math.random()-0.5)*speed, isSmoke ? Math.random()*speed : (Math.random()-0.2)*speed, (Math.random()-0.5)*speed), life: lifeBase + Math.random() * 0.5, maxLife: lifeBase + 0.5, rotSpeed: new THREE.Vector3(Math.random(), Math.random(), Math.random()), isSmoke: isSmoke });
            }
        }

        function flashScreen(hexColor) { const el = document.getElementById('screen-flash'); el.style.background = '#' + new THREE.Color(hexColor).getHexString(); el.style.opacity = '0.6'; setTimeout(() => el.style.opacity = '0', 80); }

        // --- 3D HP BARS ---
        function createHPBar() {
            const grp = new THREE.Group();
            const bg = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.4), new THREE.MeshBasicMaterial({color: 0x000000, depthTest: false}));
            const fgGeo = new THREE.PlaneGeometry(2.8, 0.2); fgGeo.translate(1.4, 0, 0); // pivot left
            const fg = new THREE.Mesh(fgGeo, new THREE.MeshBasicMaterial({color: 0xff0000, depthTest: false}));
            fg.position.set(-1.4, 0, 0.01);
            grp.add(bg); grp.add(fg); return { grp, fg };
        }

        // --- ENEMIES & BOSS GOLEM ---
        function createDummy(size, isGolem=false) {
            const grp = new THREE.Group();
            let hp, r, color;
            
            if(isGolem) {
                color = 0x8b5a2b; r = 6.0; hp = 1000;
                const mat = new THREE.MeshPhongMaterial({color: color}); const glowMat = new THREE.MeshBasicMaterial({color: 0xffaa00});
                const torso = new THREE.Mesh(new THREE.BoxGeometry(6, 8, 5).translate(0, 8, 0), mat); grp.add(torso);
                const head = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 3).translate(0, 13.5, 0), mat);
                const eyes = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.5, 3.2).translate(0, 13.5, 0), glowMat); grp.add(head); grp.add(eyes);
                const lArm = new THREE.Mesh(new THREE.BoxGeometry(3, 10, 3).translate(-5, 7, 0), mat); grp.add(lArm);
                const rArm = new THREE.Mesh(new THREE.BoxGeometry(3, 10, 3).translate(5, 7, 0), mat); grp.add(rArm);
                const lLeg = new THREE.Mesh(new THREE.BoxGeometry(3, 6, 3).translate(-2, 3, 0), mat); grp.add(lLeg);
                const rLeg = new THREE.Mesh(new THREE.BoxGeometry(3, 6, 3).translate(2, 3, 0), mat); grp.add(rLeg);
            } else {
                color = 0x552233; r = size; hp = 20 * size;
                const body = new THREE.Mesh(new THREE.CylinderGeometry(size*0.8, size, size*2.5, 6).translate(0, size*1.25, 0), new THREE.MeshPhongMaterial({color: color})); grp.add(body);
            }

            const px = isGolem ? 0 : Math.cos(Math.random()*Math.PI*2) * (30+Math.random()*200);
            const pz = isGolem ? -80 : Math.sin(Math.random()*Math.PI*2) * (30+Math.random()*200);
            grp.position.set(px, 0, pz);
            
            const rune = new THREE.Mesh(new THREE.RingGeometry(r*0.6, r*0.8, isGolem?8:5), new THREE.MeshBasicMaterial({ color: 0xff0055, transparent: true, opacity: 0.6, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
            rune.position.y = (isGolem?16:size*2.5) + 1; rune.rotation.x = Math.PI/2; grp.add(rune);

            const hpBar = createHPBar(); hpBar.grp.position.y = isGolem ? 17 : size*2.5 + 2; grp.add(hpBar.grp);

            grp.traverse(c => { if(c.isMesh && c.material && c.material.color) { c.userData.baseColor = c.material.color.getHex(); damageableColliders.push(c); } });

            grp.userData = { hp: hp, maxHp: hp, hpBar: hpBar, flashTimer: 0, freezeTimer: 0, aiTimer: 0, aggro: 0, rune: rune, r: r, isGolem: isGolem, targetPos: new THREE.Vector3() };
            scene.add(grp); dummies.push(grp); obstacles.push({ mesh: grp, isDummy: true, r: r });
        }
        createDummy(4.5, true); 
        for(let i=0; i<15; i++) createDummy(1.2 + Math.random()*1.5);

        // --- CONTROLS ---
        const activeTouches = {}; let moveVector = { x: 0, y: 0 }; let camYaw = Math.PI / 4; let camPitch = Math.PI / 3; 
        const stickBase = document.getElementById('stick-base'); const stickKnob = document.getElementById('stick-knob'); const camZone = document.getElementById('cam-zone');

        const CHANTS = { PROJECTILE: ["Burn to ash!", "Strike true!"], SHIELD: ["Unbreakable aegis!", "Hold the line!"], ENHANCE: ["Time bends to my will!", "Accelerate!"], SUMMON: ["Arise and hunt!", "Legion, awaken!"], METEOR: ["Crush them to dust!", "Wrath of the sky!"], BEAM: ["Kamehameha!", "Erase!"], CLOUD: ["Freeze their bones!", "Storm eternal!"], HEAL: ["Mend the wounds!", "Life flows!"], TERRAIN: ["Rise from the deep!", "Earth obey!"], TITAN: ["Unmatched scale!", "Colossal power!"] };

        // --- ABILITIES ---

            const r1 = new THREE.Mesh(new THREE.TorusGeometry(size*1.6, 0.05, 4, 16), new THREE.MeshBasicMaterial({color: auraColor, wireframe: true})); r1.rotation.x = Math.PI/2; grp.add(r1);
            const r2 = new THREE.Mesh(new THREE.TorusGeometry(size*1.8, 0.05, 4, 16), new THREE.MeshBasicMaterial({color: 0xffffff, wireframe: true})); r2.rotation.y = Math.PI/2; grp.add(r2);

            const wireLayer = new THREE.Mesh(new THREE.IcosahedronGeometry(radius*1.05, 2), new THREE.MeshBasicMaterial({ color: 0x4df3ff, wireframe: true, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending })); wireLayer.userData.baseOpacity = 0.6; grp.add(wireLayer);

        function createSummon(mana, sharp, round, line) {

            const flash = new THREE.Mesh(new THREE.SphereGeometry(radius*0.8, 16, 16), new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 1, blending: THREE.AdditiveBlending})); flash.position.copy(pos); scene.add(flash); activeParticles.push({mesh: flash, isFlash: true, life: 0.3, maxLife: 0.3});
            for(let i=0; i<3; i++) { const wave = new THREE.Mesh(new THREE.RingGeometry(0.1, radius*(1 + i*0.5), 32), new THREE.MeshBasicMaterial({color: i%2===0 ? 0xffffff : volColor, transparent: true, opacity: 0.8 - i*0.2, side: THREE.DoubleSide, blending: THREE.AdditiveBlending})); wave.position.copy(pos); wave.rotation.x = Math.PI/2; scene.add(wave); activeParticles.push({ mesh: wave, isWave: true, life: 0.3 + i*0.1, maxLife: 0.3 + i*0.1, maxScale: radius*(1 + i*0.5) }); }
            if (isMeteor) { spawnParticles(pos, 0xffffff, 40, 40, 0.5, 0.8); spawnParticles(pos, 0x222222, 50, 15, 2.0, 3.0, true); } else if (sharp >= 10) { spawnParticles(pos, 0xffffff, 20 + sharp, 30, 0.4, 0.5); for(let i=0; i<4; i++) { const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, radius*2.5, 3), new THREE.MeshBasicMaterial({color: 0xaa00ff, wireframe:true})); bolt.position.copy(pos); bolt.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI); scene.add(bolt); activeParticles.push({mesh: bolt, isBolt: true, life: 0.25, maxLife: 0.25}); } } else { spawnParticles(pos, COLORS.sharp, 15 + sharp, 15 + mana, 0.5 + mana*0.05, 1); }
            dummies.forEach(d => { if ((sharp >= 10 || isMeteor) && d.position.distanceTo(pos) < radius + d.userData.r + 5) d.traverse(c => { if(c.isMesh && c.material) c.material.color.setHex(0xffffff); }); if (d.position.distanceTo(pos) < radius + d.userData.r) applyDamage(d, dmg); });
        }

        function applyDamage(dummy, amount) {
            const isCrit = Math.random() < 0.25; const finalDamage = isCrit ? amount * 2.5 : amount;
            dummy.userData.hp -= finalDamage; dummy.userData.flashTimer = 0.15; dummy.userData.aggro += finalDamage;
            dummy.traverse(c => { if(c.isMesh && c.material) c.material.color.setHex(0xffffff); });
            showDamageText(finalDamage, dummy.position, isCrit); spawnParticles(dummy.position, 0xffaa00, 10, 10, 0.4);

            if (dummy.userData.hp <= 0) {
                spawnParticles(dummy.position, COLORS.sharp, 30, 25, 0.8, 1.5); spawnParticles(dummy.position, 0xffffff, 20, 40, 0.6, 1.0);
                if(!dummy.userData.isGolem) { const angle = Math.random() * Math.PI * 2; const rad = 30 + Math.random() * 80; dummy.position.set(Math.cos(angle)*rad, 0, Math.sin(angle)*rad); const obs = obstacles.find(o => o.mesh === dummy); if(obs) { obs.x = dummy.position.x; obs.z = dummy.position.z; } } else { dummy.position.set(0, 0, -80); }
                dummy.userData.hp = dummy.userData.maxHp; dummy.userData.freezeTimer = 0; dummy.userData.aggro = 0;
            }
        }

        // --- MAIN LOOP ---
        const clock = new THREE.Clock(); let shakeTime = 0; let shakeIntensity = 0; let walkCycle = 0; let ghostTimer = 0; const camTargetPos = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate); const rawDt = Math.min(clock.getDelta(), 0.05); const time = clock.getElapsedTime(); const dt = rawDt * globalTimeScale;

            skyGroup.rotation.y = time * 0.04 * globalTimeScale; wisps.forEach(w => { w.position.y = w.userData.originY + Math.sin(time*w.userData.speed + w.userData.offset)*2; }); staffOrb.position.y = 5.7 + Math.sin(time * 8) * 0.2;
            
            // Titan scaling
            if(PlayerStats.titanTimer > 0) {
                PlayerStats.titanTimer -= rawDt;
                playerGroup.scale.lerp(new THREE.Vector3(PlayerStats.titanMult, PlayerStats.titanMult, PlayerStats.titanMult), 0.1);
                playerRadius = 1.5 * playerGroup.scale.x;
            } else { playerGroup.scale.lerp(new THREE.Vector3(1,1,1), 0.1); playerRadius = 1.5; }

            // Healing
            if(PlayerStats.healTimer > 0) {
                PlayerStats.healTimer -= rawDt;
                const healAmt = PlayerStats.healRate * rawDt; PlayerStats.hp = Math.min(PlayerStats.maxHp, PlayerStats.hp + healAmt);
                updateUI(); if(Math.random() < 0.1) spawnParticles(playerGroup.position, COLORS.heal, 1, 5, 0.5);
                if(PlayerStats.healTimer <= 0) showDamageText(PlayerStats.healRate * (5 + dScale(State.lastMana)*3), playerGroup.position, false, true); // summary
            }

            // Chat Bubble tracking
            if(activeChatBubble) {
                activeChatBubble.life -= rawDt;
                if(activeChatBubble.life <= 0) { activeChatBubble.el.style.opacity = '0'; setTimeout(()=> { if(activeChatBubble) activeChatBubble.el.remove(); activeChatBubble = null; }, 200); }
                else {
                    activeChatBubble.el.style.opacity = '1';
                    const pos = playerGroup.position.clone(); pos.y += 6 * playerGroup.scale.y; pos.project(camera);
                    const cx = (pos.x * 0.5 + 0.5) * window.innerWidth; const cy = (pos.y * -0.5 + 0.5) * window.innerHeight;
                    activeChatBubble.el.style.transform = `translate(-50%, -100%) translate(${cx}px, ${cy}px)`;
                }
            }

            Physics.velocityY -= Physics.gravity * rawDt; playerGroup.position.y += Physics.velocityY * rawDt;
            if (playerGroup.position.y <= 0) { playerGroup.position.y = 0; Physics.velocityY = 0; Physics.isGrounded = true; }

            if (moveVector.x !== 0 || moveVector.y !== 0) {
                const airFactor = Physics.isGrounded ? 1.0 : (PlayerStats.buffTimer > 0 ? 0.7 : 0.3);
                const speed = PlayerStats.baseSpeed * PlayerStats.speedMultiplier * airFactor * rawDt;
                const worldDirX = moveVector.x * Math.cos(camYaw) + moveVector.y * Math.sin(camYaw); const worldDirZ = -moveVector.x * Math.sin(camYaw) + moveVector.y * Math.cos(camYaw);
                let nextX = playerGroup.position.x + worldDirX * speed; let nextZ = playerGroup.position.z + worldDirZ * speed;
                for(let obs of obstacles) {
                    if(obs.mesh && obs.mesh.userData && obs.mesh.userData.hp <= 0) continue; // ignore dead dummies
                    let dx = nextX - obs.x; let dz = nextZ - obs.z; let distSq = dx*dx + dz*dz; let minDist = playerRadius + obs.r;
                    if(distSq < minDist * minDist) { let dist = Math.sqrt(distSq); if(dist === 0) { dx=1; dist=1; } let overlap = minDist - dist; nextX += (dx/dist) * overlap; nextZ += (dz/dist) * overlap; }
                }
                playerGroup.position.x = nextX; playerGroup.position.z = nextZ;
                const targetAngle = Math.atan2(worldDirX, worldDirZ); let angleDiff = targetAngle - playerGroup.rotation.y; angleDiff = Math.atan2(Math.sin(angleDiff), Math.cos(angleDiff)); playerGroup.rotation.y += angleDiff * 15 * rawDt;
                if (Physics.isGrounded) { walkCycle += rawDt * 20 * PlayerStats.speedMultiplier; robe.rotation.z = Math.sin(walkCycle * 0.6) * 0.15; }
                if (PlayerStats.isHighEnhance) { ghostTimer -= rawDt; if(ghostTimer <= 0) { ghostTimer = 0.1; const ghost = createPlayerModel(true); ghost.grp.position.copy(playerGroup.position); ghost.grp.rotation.copy(playerGroup.rotation); ghost.grp.scale.copy(playerGroup.scale); scene.add(ghost.grp); ghosts.push({mesh: ghost.grp, life: 0.5, maxLife: 0.5}); } }
            } else { robe.rotation.z = THREE.MathUtils.lerp(robe.rotation.z, 0, 0.15); }

            if (PlayerStats.buffTimer > 0) { PlayerStats.buffTimer -= rawDt; if (PlayerStats.buffTimer <= 0) { PlayerStats.speedMultiplier = 1.0; PlayerStats.isHighEnhance = false; globalTimeScale = 1.0; document.getElementById('time-filter').style.opacity = '0'; } }

            // Obstacles handling (Terrain Magic)
            for(let i=obstacles.length-1; i>=0; i--) {
                const obs = obstacles[i];
                if(obs.isTerrain) {
                    obs.mesh.position.y = THREE.MathUtils.lerp(obs.mesh.position.y, obs.targetY, 0.1);
                    obs.life -= rawDt;
                    if(obs.life <= 0) {
                        spawnParticles(obs.mesh.position, COLORS.terrain, 15, 10, 0.5, 1.5, true);
                        scene.remove(obs.mesh); const ccIdx = cameraColliders.indexOf(obs.mesh); if(ccIdx>-1) cameraColliders.splice(ccIdx, 1);
                        obstacles.splice(i, 1);
                    }
                }
            }

            for (let i = spells.length - 1; i >= 0; i--) {
                const sp = spells[i]; sp.life -= dt;
                if (sp.type === 'projectile' || sp.type === 'enemy_rock') {
                    sp.mesh.position.addScaledVector(sp.dir, sp.speed * dt);
                    if(sp.mesh.userData && sp.mesh.userData.rings) { sp.mesh.userData.rings[0].rotation.x += dt * 10; sp.mesh.userData.rings[1].rotation.y += dt * 12; }
                    if(sp.type === 'projectile') { if (sp.sharp >= 10 && Math.random() > 0.4) spawnParticles(sp.mesh.position, 0xffffff, 1, 5, 0.2); else spawnParticles(sp.mesh.position, COLORS.sharp, 2, 2, 0.3, 0.8); }
                    else { sp.mesh.rotation.x += dt*5; sp.mesh.rotation.z += dt*5; spawnParticles(sp.mesh.position, 0x5c4033, 1, 2, 0.3); }

                    let hitSomething = false; if (sp.mesh.position.y < 0.2) hitSomething = true; 
                    if (!hitSomething) { for (let obs of obstacles) { if(obs.mesh && obs.mesh === sp.mesh) continue; let dx = sp.mesh.position.x - obs.x; let dz = sp.mesh.position.z - obs.z; if (dx*dx + dz*dz < (obs.r + 1.0)*(obs.r + 1.0)) { hitSomething = true; break; } } }
                    
                    if (!hitSomething) {
                        if(sp.type === 'projectile') {
                            for (let d of dummies) { if (sp.hitList.includes(d)) continue; if (sp.mesh.position.distanceTo(d.position) < 4.0 + d.userData.r) { applyDamage(d, sp.damage); sp.hitList.push(d); sp.penetration--; triggerExplosion(sp.mesh.position, sp.mana, sp.sharp); if (sp.penetration <= 0) hitSomething = true; } }
                        } else if (sp.type === 'enemy_rock') {
                            if (sp.mesh.position.distanceTo(playerGroup.position) < 4.0 + playerRadius) { applyDamageToPlayer(sp.damage); hitSomething = true; }
                        }
                    }

                    const distTravelled = sp.startPos.distanceTo(sp.mesh.position);
                    if (hitSomething || sp.life <= 0 || distTravelled > 250) { if(sp.type==='projectile') { if(hitSomething || distTravelled > 250 || sp.life <= 0) triggerExplosion(sp.mesh.position, sp.mana, sp.sharp); } else { spawnParticles(sp.mesh.position, 0x5c4033, 10, 10, 0.5); } scene.remove(sp.mesh); spells.splice(i, 1); }
                } 
                else if (sp.type === 'meteor') {
                    sp.mesh.position.addScaledVector(sp.dir, sp.speed * dt); sp.mesh.children[0].rotation.x += dt*5; sp.mesh.children[1].rotation.y += dt*10; spawnParticles(sp.mesh.position, COLORS.meteor, 5, 5, 0.4, 2.0);
                    if (sp.mesh.position.y <= 0.5) { triggerExplosion(sp.mesh.position, sp.mana, sp.sharp, true); scene.remove(sp.mesh); spells.splice(i, 1); }
                }
                else if (sp.type === 'beam') {
                    const t = sp.life/sp.maxLife; sp.beamCore.material.opacity = t; sp.beamAura.material.opacity = t*0.6; sp.beamAura.scale.setScalar(1 + (1-t)*0.5);
                    let currentLen = sp.maxLen; beamRaycaster.set(sp.mesh.position, sp.dir);
                    const intersects = beamRaycaster.intersectObjects(cameraColliders, true); if(intersects.length > 0 && intersects[0].distance < currentLen) { currentLen = intersects[0].distance; }
                    const dmgIntersects = beamRaycaster.intersectObjects(damageableColliders, false);
                    if(dmgIntersects.length > 0 && dmgIntersects[0].distance < currentLen) { currentLen = dmgIntersects[0].distance; let hitDummy = dummies.find(d => d.children.includes(dmgIntersects[0].object)); if(hitDummy) applyDamage(hitDummy, sp.damage * dt * 60); }
                    sp.beamCore.scale.z = currentLen; sp.beamAura.scale.z = currentLen;
                    if(currentLen < sp.maxLen) { const hitPos = sp.mesh.position.clone().add(sp.dir.clone().multiplyScalar(currentLen)); spawnParticles(hitPos, COLORS.beam, 3, 10, 0.2, 1.5); }
                    if (sp.life <= 0) { scene.remove(sp.mesh); spells.splice(i, 1); }
                }
                else if (sp.type === 'shield') {
                    sp.mesh.position.copy(playerGroup.position); sp.mesh.position.y += 2.0 * playerGroup.scale.y; sp.extras.forEach(ext => { ext.mesh.rotation.x += dt * ext.speedX; ext.mesh.rotation.y += dt * ext.speedY; }); const pulse = 1 + Math.sin(time * 12) * 0.05; sp.mesh.scale.setScalar(pulse * playerGroup.scale.x);
                    sp.pulseTimer -= dt; if (sp.pulseTimer <= 0) { sp.pulseTimer = 0.3; for (let d of dummies) { if (d.position.distanceTo(playerGroup.position) < sp.radius*playerGroup.scale.x + d.userData.r) { applyDamage(d, sp.damage); spawnParticles(d.position, COLORS.mana, 8, 15, 0.4); } } }
                    if (sp.life <= 0) { scene.remove(sp.mesh); spells.splice(i, 1); } else { const fade = Math.min(1.0, sp.life / 0.8); sp.mesh.children.forEach(c => { if(c.material && c.userData.baseOpacity) c.material.opacity = c.userData.baseOpacity * fade; }); }
                }
            }

            for(let i = clouds.length - 1; i >= 0; i--) {
                const c = clouds[i]; c.life -= dt; if (c.life <= 0) { scene.remove(c.mesh); clouds.splice(i, 1); continue; }
                c.mesh.position.y = playerGroup.position.y + 10*playerGroup.scale.y + Math.sin(time * 2) * 2;
                if(!c.target || c.target.userData.hp <= 0) { let minDist = 150; c.target = null; dummies.forEach(d => { const dist = c.mesh.position.distanceTo(d.position); if(dist < minDist) { minDist = dist; c.target = d; } }); }
                if(c.target) {
                    const cloudTarg = c.target.position.clone(); cloudTarg.y += 15; c.mesh.position.lerp(cloudTarg, 0.03 * globalTimeScale);
                    c.attackTimer -= dt;
                    if (c.attackTimer <= 0) { c.attackTimer = 5.0; c.target.userData.freezeTimer = c.freezeDur; applyDamage(c.target, 50); const dist = c.mesh.position.distanceTo(c.target.position); const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, dist, 4).translate(0, dist/2, 0), new THREE.MeshBasicMaterial({color: 0xffffff, blending: THREE.AdditiveBlending})); bolt.position.copy(c.target.position); bolt.lookAt(c.mesh.position); bolt.rotation.x -= Math.PI/2; scene.add(bolt); activeParticles.push({mesh: bolt, isBolt: true, life: 0.2, maxLife: 0.2}); spawnParticles(c.target.position, COLORS.cloud, 20, 10, 0.5, 2.0); }
                } c.mesh.children.forEach((puff, idx) => { puff.rotation.y += dt*(0.5+idx*0.1); });
            }

            for(let i = summons.length - 1; i >= 0; i--) {
                const sm = summons[i]; sm.life -= dt; if(sm.life <= 0) { spawnParticles(sm.mesh.position, COLORS.line, 10, 10, 0.5); scene.remove(sm.mesh); summons.splice(i, 1); continue; }
                if(!sm.target || sm.target.userData.hp <= 0) { let minDist = 999; sm.target = null; dummies.forEach(d => { const dist = sm.mesh.position.distanceTo(d.position); if(dist < minDist) { minDist = dist; sm.target = d; } }); }
                if(sm.target) { const dir = sm.target.position.clone().sub(sm.mesh.position); dir.y = 0; const dist = dir.length(); if(dist > sm.target.userData.r + 1.0) { dir.normalize(); sm.mesh.position.addScaledVector(dir, sm.speed * dt); sm.mesh.rotation.y = Math.atan2(dir.x, dir.z); } else { sm.attackTimer -= dt; if(sm.attackTimer <= 0) { sm.attackTimer = 0.5; applyDamage(sm.target, sm.damage); spawnParticles(sm.target.position, COLORS.line, 5, 5, 0.3); } } }
            }

            dummies.forEach(d => {
                const hpBar = d.userData.hpBar;
                if(hpBar) {
                    hpBar.fg.scale.x = Math.max(0.01, d.userData.hp / d.userData.maxHp);
                    hpBar.grp.lookAt(camera.position);
                }

                if(d.userData.freezeTimer > 0) { d.userData.freezeTimer -= dt; d.traverse(c => { if(c.isMesh && c.material) c.material.color.setHex(0x88ccff); }); } 
                else {
                    d.userData.rune.rotation.z -= dt * 3.0; 
                    
                    if(d.userData.isGolem) {
                        d.userData.aiTimer -= dt;
                        if(d.userData.aiTimer <= 0) {
                            d.userData.aiTimer = 2.0 + Math.random()*2;
                            if(Math.random() > 0.5) { d.userData.targetPos.set(d.position.x + (Math.random()-0.5)*40, 0, d.position.z + (Math.random()-0.5)*40); }
                            else { d.userData.targetPos.copy(playerGroup.position); }
                        }
                        if(d.position.distanceTo(d.userData.targetPos) > 2) {
                            const dir = d.userData.targetPos.clone().sub(d.position).normalize(); dir.y = 0;
                            d.position.addScaledVector(dir, 15 * dt); d.rotation.y = Math.atan2(dir.x, dir.z);
                        }
                        // Boss Aggro Attack
                        if(d.userData.aggro > 150) { d.userData.aggro = 0; spawnEnemyRock(new THREE.Vector3(d.position.x, 15, d.position.z), playerGroup.position); }
                    }

                    if (d.userData.flashTimer > 0) { d.userData.flashTimer -= dt; if (d.userData.flashTimer <= 0) { d.traverse(c => { if(c.isMesh && c.material && c.userData.baseColor !== undefined) c.material.color.setHex(c.userData.baseColor); }); } } 
                    else { d.traverse(c => { if(c.isMesh && c.material && c.userData.baseColor !== undefined) c.material.color.setHex(c.userData.baseColor); }); }
                }
            });

            for(let i = ghosts.length - 1; i >= 0; i--) { const g = ghosts[i]; g.life -= rawDt; if(g.life <= 0) { scene.remove(g.mesh); ghosts.splice(i, 1); } else { const op = (g.life / g.maxLife) * 0.4; g.mesh.traverse(c => { if(c.isMesh && c.material) c.material.opacity = op; }); } }

            for (let i = activeParticles.length - 1; i >= 0; i--) {
                const p = activeParticles[i]; p.life -= dt;
                if (p.life <= 0) { scene.remove(p.mesh); activeParticles.splice(i, 1); } 
                else {
                    if (p.isFlash) { p.mesh.scale.setScalar(1 + (1 - p.life/p.maxLife)*0.5); p.mesh.material.opacity = p.life/p.maxLife; }
                    else if (p.isVolume) { const s = 1 + (1 - p.life/p.maxLife) * p.maxScale; p.mesh.scale.setScalar(s); p.mesh.material.opacity = (p.life/p.maxLife) * 0.7; }
                    else if (p.isWave) { const s = 1 + (1 - p.life/p.maxLife) * p.maxScale; p.mesh.scale.set(s, s, s); p.mesh.material.opacity = p.life/p.maxLife; } 
                    else if (p.isBolt) { p.mesh.material.opacity = p.life/p.maxLife; }
                    else { if(p.isSmoke) { p.vel.y += rawDt * 10; } else { p.vel.y -= rawDt * 15; } p.mesh.position.addScaledVector(p.vel, dt); p.mesh.material.opacity = p.life / p.maxLife; p.mesh.scale.setScalar(p.life / p.maxLife * 1.5); p.mesh.rotation.x += p.rotSpeed.x * dt * 20; p.mesh.rotation.y += p.rotSpeed.y * dt * 20; }
                }
            }

            camTargetPos.lerp(playerGroup.position, 0.15); const targetVec = new THREE.Vector3(camTargetPos.x, camTargetPos.y + 2.0*playerGroup.scale.y, camTargetPos.z);
            const dirY = Math.cos(camPitch); const hDist = Math.sin(camPitch); const dirX = Math.sin(camYaw) * hDist; const dirZ = Math.cos(camYaw) * hDist; const rayDir = new THREE.Vector3(dirX, dirY, dirZ).normalize();

            let actualCamDist = 45 * playerGroup.scale.x; cameraRaycaster.set(targetVec, rayDir); const intersects = cameraRaycaster.intersectObjects(cameraColliders, false);
            if (intersects.length > 0 && intersects[0].distance < actualCamDist) { actualCamDist = Math.max(1.0, intersects[0].distance - 1.5); }
            let shakeX = 0, shakeY = 0, shakeZ = 0; if (shakeTime > 0) { shakeTime -= rawDt; shakeX = (Math.random() - 0.5) * shakeIntensity * 3; shakeY = (Math.random() - 0.5) * shakeIntensity * 3; shakeZ = (Math.random() - 0.5) * shakeIntensity * 3; }
            const targetCamPos = new THREE.Vector3(targetVec.x + rayDir.x * actualCamDist + shakeX, Math.max(0.5, targetVec.y + rayDir.y * actualCamDist + shakeY), targetVec.z + rayDir.z * actualCamDist + shakeZ);

            const lerpSpeed = actualCamDist < 44*playerGroup.scale.x ? 0.35 : 0.1; camera.position.lerp(targetCamPos, lerpSpeed); camera.lookAt(new THREE.Vector3(targetVec.x, targetVec.y + 1.0*playerGroup.scale.y, targetVec.z)); renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        updateUI(); animate();
    </script>
